[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "p2-decode"
dynamic = ["version"]
description = "SRS/VMM3a raw data (pcapng) to hits, in electronics coordinates"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Alexandra Kallitsopoulou" }]
dependencies = ["numpy>=1.21", "pandas>=1.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
p2-decode = "p2_decode.cli:main"

[tool.setuptools.dynamic]
version = { attr = "p2_decode.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
