# Publish this repo to the CEA GitLab project, WITHOUT touching its main:
#   https://drf-gitlab.cea.fr/p2/p2readout/p2basket-decode
#   GitHub branch X   -> GitLab branch ak/X    (main -> ak/main)
#   GitHub tag vN.M.K -> GitLab tag ak-vN.M.K
# GitLab main belongs to the colleagues there; they merge ak/main when they want.
# Needs the repo secret CEA_GITLAB_TOKEN: a GitLab *project* access token
# (role Maintainer, scope write_repository) of that GitLab project.
# Never force-pushes; skips with a warning while the secret is unset.
name: mirror-to-cea-gitlab
on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:
concurrency:
  group: mirror-cea
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to drf-gitlab (ak/ branches, ak- tags)
        env:
          GL_TOKEN: ${{ secrets.CEA_GITLAB_TOKEN }}
          GL_REPO: drf-gitlab.cea.fr/p2/p2readout/p2basket-decode.git
        run: |
          if [ -z "$GL_TOKEN" ]; then
            echo "::warning::CEA_GITLAB_TOKEN not set, skipping mirror"; exit 0
          fi
          case "$GITHUB_REF" in
            refs/heads/*) dst="refs/heads/ak/${GITHUB_REF#refs/heads/}" ;;
            refs/tags/*)  dst="refs/tags/ak-${GITHUB_REF#refs/tags/}" ;;
            *) echo "::error::unexpected ref $GITHUB_REF"; exit 1 ;;
          esac
          url="https://oauth2:${GL_TOKEN}@${GL_REPO}"
          err="${RUNNER_TEMP:-/tmp}/push.err"
          if ! git push "$url" "${GITHUB_SHA}:${dst}" 2>"$err"; then
            cat "$err" >&2
            # A tag that already exists is fine if it is the same commit: the
            # branch push of the same commit publishes all tags too, and may win
            # the race. Anything else (other errors, a different commit) fails.
            case "$dst" in refs/tags/*) ;; *) exit 1 ;; esac
            grep -q 'already exists' "$err" || exit 1
            # use the peeled commit (^{}) for an annotated tag, else the ref itself
            have=$(git ls-remote "$url" "$dst" "${dst}^{}" | awk -v r="$dst" \
              '$2 == r "^{}" {p = $1} $2 == r {t = $1} END {print (p != "" ? p : t)}')
            if [ "$have" = "$GITHUB_SHA" ]; then
              echo "::notice::${dst} already on GitLab at ${GITHUB_SHA}, nothing to do"
            else
              echo "::error::${dst} already on GitLab at ${have:-?}, not ${GITHUB_SHA}"
              exit 1
            fi
          fi
          # on a branch push, also publish all existing tags (idempotent)
          if [ "${GITHUB_REF#refs/heads/}" != "$GITHUB_REF" ]; then
            refs=$(git tag -l 'v*' | sed 's|.*|refs/tags/&:refs/tags/ak-&|')
            [ -n "$refs" ] && git push "$url" $refs || true
          fi
